version: "3.8"

services:
  pg_db_local:
    image: postgres:16-alpine
    container_name: themecp-v2-pg-db-local
    restart: always
    environment:
      - POSTGRES_USER=themecp
      - POSTGRES_PASSWORD=themecp
      - POSTGRES_DB=themecp_v2
    ports:
      - "5432:5432"
    volumes:
      - ./data/pg_data:/var/lib/postgresql/data
    networks:
      - themecp-v2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themecp -d themecp_v2"]
      interval: 10s
      timeout: 5s
      retries: 5

  pg_db_test:
    image: postgres:16-alpine
    container_name: themecp-v2-pg-db-test
    restart: always
    environment:
      - POSTGRES_USER=themecp_test
      - POSTGRES_PASSWORD=themecp_test
      - POSTGRES_DB=themecp_v2_test
    ports:
      - "5433:5432"  # Different port to avoid conflict
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests (data not persisted)
    networks:
      - themecp-v2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themecp_test -d themecp_v2_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_local:
    image: redis:7-alpine
    container_name: themecp-v2-redis-local
    restart: always
    ports:
      - "6379:6379"
    # A cache, not a database: every value is reconstructible from Postgres or
    # Codeforces, so persistence is off (--save "" --appendonly no) to avoid
    # fsync pauses. maxmemory + an eviction policy mirrors managed Redis, which
    # is always capped — without it, eviction bugs only appear in production.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - themecp-v2-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    container_name: themecp-v2-redis-test
    restart: always
    ports:
      - "6380:6379"  # Different port to avoid conflict
    # Started and stopped by the docker_compose fixture in test/conftest.py,
    # which also flushes it between tests. Nothing here is persisted, matching
    # the tmpfs on pg_db_test.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    networks:
      - themecp-v2-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  themecp-v2-network:
    driver: bridge